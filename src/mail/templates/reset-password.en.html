<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset your password — StreetEye</title>
</head>
<body style="font-family: sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 16px; color: #111;">
  <h1 style="font-size: 24px; margin-bottom: 8px;">Reset your password</h1>
  <p style="color: #555;">We received a request to reset the password for your account.</p>
  <a href="{{resetUrl}}"
     style="display:inline-block;margin:24px 0;padding:12px 24px;background:#111;color:#fff;text-decoration:none;border-radius:6px;font-weight:600;">
    Reset password
  </a>
  <p style="color:#888;font-size:13px;">Link expires in 30 minutes. If you didn't request a reset, ignore this email.</p>
</body>
</html>
